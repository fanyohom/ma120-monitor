# Copy to etf_plans.toml. Amounts are CNY; these are editable preview defaults.
version = 1

[settings]
ma_days = 500
lot_size = 100
# First matching strict upper bound wins. Above the last band use above_multiplier.
bands = [
  { below = -20, multiplier = 2.0 },
  { below = -10, multiplier = 1.5 },
  { below = 0, multiplier = 1.2 },
  { below = 10, multiplier = 1.0 },
  { below = 20, multiplier = 0.8 },
]
above_multiplier = 0.5

[valuation]
lookback_years = 10
min_samples = 2000
min_span_days = 3285
max_age_days = 7
buy_below = 30
high_at = 70

