# Copy to etf_plans.toml. Amounts are CNY; these are editable preview defaults.
version = 1

[settings]
ma_days = 500
lot_size = 100
# First matching strict upper bound wins. Above the last band use above_multiplier.
bands = [
  { below = -20, multiplier = 2.0 },
  { below = -10, multiplier = 1.5 },
  { below = 0, multiplier = 1.2 },
  { below = 10, multiplier = 1.0 },
  { below = 20, multiplier = 0.8 },
]
above_multiplier = 0.5

[valuation]
lookback_years = 10
min_samples = 2000
min_span_days = 3285
max_age_days = 7
buy_below = 30
high_at = 70

[[plans]]
id = "csi300"
name = "沪深300ETF"
code = "510300"
index_code = "000300"
strategy = "valuation"
strategy_reason = "已有沪深300指数近十年 PE-TTM 历史，用估值分位决定是否新增投入；分位不代表 ETF 场内价格没有折溢价。"
base_amount = 1000
max_amount = 2000
frequency = "weekly"
weekday = 0
cost = 0
shares = 0
valuation_csv = "etf_valuations/000300.csv"

