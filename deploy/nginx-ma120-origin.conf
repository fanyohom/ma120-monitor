# 把应用被反代架空的 Origin 校验上移到 nginx（与 nginx-ma120.conf 配套）。
# 安装到 /etc/nginx/conf.d/ma120-origin.conf，先把 <SERVER_IP> 换成真实公网 IP。
#
# 应用收到的 Origin 已被改写成 http://127.0.0.1:8765，它自己必然放行，
# 所以这里必须按「真实来源」重新拦一次：
#   - 空 Origin：curl / 非浏览器请求，放行
#   - 本站 Origin：放行
#   - 其它一切（含evil.example）：拒绝
# 上 HTTPS 后在下方补一行 "https://<域名>" 0;
map $http_origin $ma120_origin_reject {
    default                       1;
    ""                            0;
    "http://<SERVER_IP>:8080"     0;
}
