# MA120 公网反向代理模板（已脱敏，生产验证于 2026-11-09）
#
# 安装：
#   sed -i 's/<SERVER_IP>/你的服务器公网IP/g' deploy/nginx-ma120-origin.conf
#   cp deploy/nginx-ma120.conf        /etc/nginx/sites-available/ma120
#   cp deploy/nginx-ma120-origin.conf /etc/nginx/conf.d/ma120-origin.conf
#   ln -s ../sites-available/ma120 /etc/nginx/sites-enabled/ma120
#   htpasswd -B -c /etc/nginx/ma120.htpasswd <USERNAME>
#   chown root:www-data /etc/nginx/ma120.htpasswd && chmod 640 /etc/nginx/ma120.htpasswd
#   nginx -t && systemctl reload nginx
#
# 关键约束（改任何一行前先读）：
# 1. 应用只监听 127.0.0.1:8765，且强制 Host == 127.0.0.1:8765。
#    不改写 Host 会让所有 GET 返回 403「仅允许本机访问」。
# 2. 写操作还要求 Origin == http://Host。改写 Origin 后应用自带的 CSRF
#    校验必然通过（等于失效），所以真实来源校验必须上移到
#    ma120-origin.conf 的 map —— 两个文件必须一起安装，缺一不可。
# 3. 这里仍是 HTTP + Basic Auth，凭据是明文 base64。正式使用建议终止 TLS，
#    或至少在安全组里把 8080 限制到可信来源 IP。
# 4. 上 HTTPS 时：listen 443 ssl、map 里补 https://<域名>、并给应用设置
#    MA120_TRUSTED_ORIGIN=https://<域名>（应用默认只认 http://Host）。

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/ma120.access.log;
    error_log  /var/log/nginx/ma120.error.log warn;

    auth_basic           "MA120";
    auth_basic_user_file /etc/nginx/ma120.htpasswd;

    client_max_body_size 2m;

    # 只读健康检查不含敏感明细，仅允许本机探活。
    # 外部「死人开关」告警走 HEALTHCHECK_URL，由每日任务成功后主动 ping。
    location = /api/health {
        auth_basic off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8765;
    }

    location / {
        if ($ma120_origin_reject) {
            return 403;
        }

        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header Origin http://127.0.0.1:8765;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
