name: MA120 Monitor

# 注意：astral-sh/setup-uv 自 v8.0.0 起不再发布 major/minor 标签，
# 必须写完整版本号（如 v10.3.0）或 commit SHA。写成 @v10 会让整个 workflow
# 在解析阶段就失败（几秒退出、所有步骤都不执行），报错为
# "Unable to resolve action `astral-sh/setup-uv@v10`, unable to find version `v10`"。
# 升级 setup-uv 时请连号一起改，不要图省事改回 @v11。

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 北京时间每天 11:30（UTC 03:30），上午收盘后看信号，下午仍来得及操作。
    # 用「每天」而非「周一至周五」，周末与法定节假日由脚本的
    # --skip-non-trading-day 自动跳过（RRULE 只能表达周一至周五）。
    - cron: '30 3 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: read

concurrency:
  group: ma120-monitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --extra dev

      # 回归测试失败会直接拦住合并：曾出现缓存冻结修复引入 2 项
      # 行情数据测试失败却无人拦截的情况。
      - name: Run pytest
        env:
          PYTHONUTF8: '1'
        run: uv run python -m pytest -q

  monitor:
    name: 午间监控推送
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test # 指标算错时不必再推送，避免把错误信号发到飞书
    # 只有定时和手动触发才真正推送；push/pull_request 只跑上面的测试，
    # 否则每次推送都会向飞书空推一张卡片。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Run monitor
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          PYTHONUTF8: '1'
        # --skip-non-trading-day：非A 股交易日（周末与法定节假日）
        # 探测不到当日实时行情即直接跳过，避免空推卡片。
        # 脚本在飞书推送失败时会以非零码退出，job 随即变红。
        run: uv run python stock_dynamic_monitor.py --skip-non-trading-day

  notify:
    name: 失败告警
    runs-on: ubuntu-latest
    needs: [test, monitor]
    # 任一 job 失败都要有对外信号，否则「测试红了 → 当天没推卡片」同样无人察觉。
    if: failure()
    steps:
      - name: Send Feishu alert
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TEST_RESULT: ${{ needs.test.result }}
          MONITOR_RESULT: ${{ needs.monitor.result }}
        run: |
          echo "::error::MA120 workflow failed: test=$TEST_RESULT monitor=$MONITOR_RESULT"
          if [ -n "$FEISHU_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' \
              -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"⚠️ MA120 工作流失败：test=$TEST_RESULT，monitor=$MONITOR_RESULT，请检查 Actions 日志与服务器 timer。\"}}" \
              "$FEISHU_WEBHOOK_URL" || true
          fi