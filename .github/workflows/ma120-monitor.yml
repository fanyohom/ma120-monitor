name: MA120 Monitor

on:
  schedule:
    # 北京时间周一至周五 11:30（UTC 03:30），A 股午间休市、港股盘中
    - cron: '30 3 * * 1-5'
    # 北京时间周一至周五 18:30（UTC 10:30），A 股与港股收盘后
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: read

concurrency:
  group: ma120-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Run monitor
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          PYTHONUTF8: '1'
        run: uv run python stock_dynamic_monitor.py
